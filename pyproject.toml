[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd1-rpc"
version = "0.1.0"
description = "Discord Rich Presence companion for Darkest Dungeon (Steam)"
requires-python = ">=3.10"
dependencies = ["pypresence>=4.3", "psutil>=5.9"]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
dd1-rpc = "dd1_rpc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
